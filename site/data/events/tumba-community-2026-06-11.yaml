title: "The Future Is Arriving. Is Tumbarumba Ready?"
description: |
  The gap between what's actually happening with AI and technology — and what most people understand about it — is enormous. And it's growing faster than almost anyone expected.

  This is a free community talk for everyone in the Tumbarumba region. Whether you're curious, unsettled, or just want to understand what's going on before it catches you off guard — you belong in this room. You don't have to be a tech person. You just have to care about the future of this community.

  Charlie Garrison will walk through what's actually happening, what it means for jobs, local business, and everyday life in rural and regional Australia — and what we can do about it. Not panic. Not paralysis. An honest conversation, with time for your questions.

  Free entry. All welcome. Seats are limited.
