<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 2 74 76"
  role="img"
  aria-label="Future Together"
>
  <title>Future Together</title>
  <!--
    Future Together — White/header variant
    For use on dark/teal backgrounds (header, dark sections).
    Lines and wordmark are white; amber mark elements are retained.
  -->

  <!-- White convergence lines -->
  <line
    x1="2"
    y1="5"
    x2="50"
    y2="40"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.5"
  />
  <line
    x1="2"
    y1="21"
    x2="50"
    y2="40"
    stroke="white"
    stroke-width="2.4"
    stroke-linecap="round"
    opacity="0.7"
  />
  <line
    x1="2"
    y1="40"
    x2="50"
    y2="40"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.9"
  />
  <line
    x1="2"
    y1="59"
    x2="50"
    y2="40"
    stroke="white"
    stroke-width="2.4"
    stroke-linecap="round"
    opacity="0.7"
  />
  <line
    x1="2"
    y1="75"
    x2="50"
    y2="40"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.5"
  />

  <!-- Amber gathering point (retained for brand recognition) -->
  <circle cx="50" cy="40" r="7" fill="#c4853a" />

  <!-- Amber chevron -->
  <polyline
    points="57,26 70,40 57,54"
    fill="none"
    stroke="#c4853a"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
