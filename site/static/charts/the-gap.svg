<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="gaptitle gapdesc">
  <title id="gaptitle">The Gap: AI reality vs. public perception</title>
  <desc id="gapdesc">A conceptual illustration showing the growing gap between the rapid pace of AI development and what most people perceive is happening. Since late 2022 the two have diverged significantly.</desc>

  <!-- Background -->
  <rect width="640" height="400" fill="#f7f4ef" rx="10"/>

  <!-- Header band -->
  <rect width="640" height="72" fill="#1a5f6e" rx="10"/>
  <rect y="62" width="640" height="10" fill="#1a5f6e"/>
  <text x="320" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">The gap between what's happening and what most people think</text>
  <text x="320" y="54" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="rgba(255,255,255,0.75)" text-anchor="middle">Since late 2022, AI capability and public understanding have been diverging</text>

  <!-- X-axis timeline -->
  <line x1="100" y1="310" x2="580" y2="310" stroke="#c4bfb8" stroke-width="1.5"/>
  <!-- Tick marks and labels -->
  <line x1="120" y1="306" x2="120" y2="314" stroke="#a09a93" stroke-width="1.5"/>
  <text x="120" y="326" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e6a65" text-anchor="middle">Late 2022</text>
  <text x="120" y="340" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9a958f" text-anchor="middle">ChatGPT launches</text>
  <line x1="350" y1="306" x2="350" y2="314" stroke="#a09a93" stroke-width="1.5"/>
  <text x="350" y="326" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e6a65" text-anchor="middle">2023–24</text>
  <line x1="565" y1="306" x2="565" y2="314" stroke="#a09a93" stroke-width="1.5"/>
  <text x="565" y="326" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e6a65" text-anchor="middle">2025 →</text>

  <!-- Gap fill area (amber, low opacity) -->
  <!-- Path: follow AI curve from start to end, then reverse public curve back to start -->
  <path d="M 120,300 C 270,298 390,190 565,120 L 565,240 C 440,278 300,298 120,300 Z" fill="#c4853a" opacity="0.12"/>

  <!-- AI Capability curve (teal, bold) -->
  <path d="M 120,300 C 270,298 390,190 565,120" fill="none" stroke="#1a5f6e" stroke-width="3" stroke-linecap="round"/>
  <!-- AI endpoint dot -->
  <circle cx="565" cy="120" r="7" fill="#1a5f6e" stroke="#f7f4ef" stroke-width="2"/>
  <!-- AI curve label -->
  <text x="555" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1a5f6e" text-anchor="end">AI capability</text>
  <text x="555" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#3a7f8e" text-anchor="end">(what's actually happening)</text>

  <!-- Public Awareness curve (muted amber, lighter) -->
  <path d="M 120,300 C 300,298 440,278 565,240" fill="none" stroke="#c4853a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,4"/>
  <!-- Public endpoint dot -->
  <circle cx="565" cy="240" r="6" fill="#c4853a" stroke="#f7f4ef" stroke-width="2"/>
  <!-- Public curve label -->
  <text x="555" y="232" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#c4853a" text-anchor="end">Public awareness</text>
  <text x="555" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#a07040" text-anchor="end">(what most people perceive)</text>

  <!-- Shared start dot -->
  <circle cx="120" cy="300" r="7" fill="#1c1a18" stroke="#f7f4ef" stroke-width="2"/>

  <!-- Gap label with bracket indicator -->
  <line x1="570" y1="122" x2="578" y2="122" stroke="#c4853a" stroke-width="1.5"/>
  <line x1="578" y1="122" x2="578" y2="238" stroke="#c4853a" stroke-width="1.5"/>
  <line x1="570" y1="238" x2="578" y2="238" stroke="#c4853a" stroke-width="1.5"/>
  <text x="592" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#c4853a" text-anchor="middle">The</text>
  <text x="592" y="198" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#c4853a" text-anchor="middle">Gap</text>

  <!-- Quote callout -->
  <rect x="60" y="356" width="520" height="32" rx="6" fill="white" stroke="#d8d3cc" stroke-width="1"/>
  <text x="320" y="376" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-style="italic" fill="#1a5f6e" text-anchor="middle">"The gap between what's actually happening and what most people think is happening is enormous."</text>

  <!-- Source note -->
  <text x="320" y="396" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#a09a93" text-anchor="middle">Conceptual illustration · Future Together</text>
</svg>
