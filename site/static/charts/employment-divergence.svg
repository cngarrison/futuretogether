<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="chtitle chdesc">
  <title id="chtitle">Employment Divergence in AI-Exposed Roles, 2022–2025</title>
  <desc id="chdesc">Stanford/NBER research tracking 25 million US workers shows software developers aged 22–25 lost 20% employment and all AI-exposed workers 22–25 lost 6%, while experienced workers aged 35–49 in the same roles grew by 8%, even as headline unemployment stayed stable.</desc>

  <!-- Background -->
  <rect width="700" height="460" fill="#f7f4ef" rx="10"/>

  <!-- Header band -->
  <rect width="700" height="76" fill="#1a5f6e" rx="10"/>
  <rect y="66" width="700" height="10" fill="#1a5f6e"/>
  <text x="350" y="32" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">What the employment data actually shows</text>
  <text x="350" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="rgba(255,255,255,0.75)" text-anchor="middle">25 million US workers · Stanford/NBER · Oct 2022 – Sept 2025</text>

  <!-- Y-axis gridlines -->
  <line x1="148" y1="188" x2="518" y2="188" stroke="#e0dbd4" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="140" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#b0aaa3" text-anchor="end">+10%</text>
  <line x1="148" y1="230" x2="518" y2="230" stroke="#c4bfb8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="140" y="234" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8a847d" text-anchor="end">0%</text>
  <line x1="148" y1="272" x2="518" y2="272" stroke="#e0dbd4" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="140" y="276" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#b0aaa3" text-anchor="end">−10%</text>
  <line x1="148" y1="314" x2="518" y2="314" stroke="#e0dbd4" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="140" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#b0aaa3" text-anchor="end">−20%</text>

  <!-- Column markers -->
  <line x1="185" y1="108" x2="185" y2="348" stroke="#d8d3cc" stroke-width="1"/>
  <line x1="510" y1="108" x2="510" y2="348" stroke="#d8d3cc" stroke-width="1"/>
  <text x="185" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1c1a18" text-anchor="middle">Oct 2022</text>
  <text x="510" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1c1a18" text-anchor="middle">Sept 2025</text>

  <!-- Series 1: Software developers 22-25, -20% (solid amber) -->
  <line x1="185" y1="230" x2="510" y2="314" stroke="#c4853a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="510" cy="314" r="7" fill="#c4853a" stroke="#f7f4ef" stroke-width="2"/>
  <text x="524" y="310" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#c4853a">−20%</text>
  <text x="524" y="328" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#1c1a18">Software developers</text>
  <text x="524" y="342" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6e6a65">ages 22–25</text>

  <!-- Series 2: All AI-exposed 22-25, -6% (dashed amber) -->
  <line x1="185" y1="230" x2="510" y2="255" stroke="#c4853a" stroke-width="2" stroke-dasharray="7,4" opacity="0.6"/>
  <circle cx="510" cy="255" r="5" fill="#c4853a" opacity="0.65" stroke="#f7f4ef" stroke-width="1.5"/>
  <text x="524" y="252" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#c4853a" opacity="0.8">−6%</text>
  <text x="524" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6e6a65">all AI-exposed workers, 22–25</text>

  <!-- Series 3: Experienced workers 35-49, +8% (solid teal) -->
  <line x1="185" y1="230" x2="510" y2="196" stroke="#1a5f6e" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="510" cy="196" r="7" fill="#1a5f6e" stroke="#f7f4ef" stroke-width="2"/>
  <text x="524" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#1a5f6e">+8%</text>
  <text x="524" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#1c1a18">Experienced workers</text>
  <text x="524" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6e6a65">ages 35–49, same roles</text>

  <!-- Shared baseline start dot -->
  <circle cx="185" cy="230" r="9" fill="#1c1a18" stroke="#f7f4ef" stroke-width="2"/>
  <text x="172" y="220" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6e6a65" text-anchor="end">All groups</text>
  <text x="172" y="232" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6e6a65" text-anchor="end">start here</text>

  <!-- Context box -->
  <rect x="36" y="360" width="628" height="52" rx="8" fill="white" stroke="#d8d3cc" stroke-width="1"/>
  <text x="350" y="381" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1a5f6e" text-anchor="middle">Meanwhile: overall employment kept growing · headline unemployment stayed stable</text>
  <text x="350" y="399" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e6a65" text-anchor="middle">The headline number doesn't capture what's happening below the surface</text>

  <!-- Source attribution -->
  <text x="350" y="444" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#a09a93" text-anchor="middle">Source: Brynjolfsson, Chandar &amp; Chen — Stanford Digital Economy Lab / NBER (Nov 2025) · ADP data, 25M workers</text>
</svg>
