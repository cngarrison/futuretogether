<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Future Together</title>
  <!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #f7f4ef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f4ef;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:600px;" cellpadding="0" cellspacing="0">

          <!-- Header -->
          <tr>
            <td style="background-color:#1a5f6e;border-radius:10px 10px 0 0;padding:28px 32px;text-align:center;">
              <a href="https://futuretogether.community" style="text-decoration:none;">
                <img src="https://futuretogether.community/logo-white.svg" alt="Future Together" width="200" height="auto"
                     style="display:block;margin:0 auto;max-width:200px;" />
              </a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color:#ffffff;padding:36px 40px;border-left:1px solid #e8e3db;border-right:1px solid #e8e3db;">

              <h2 style="margin:0 0 16px;font-size:22px;font-weight:700;color:#1a5f6e;">Your verification code</h2>
              <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:#1c1a18;">Use the code below to verify your identity. It expires shortly and can only be used once.</p>
              <p style="font-size:36px;font-weight:700;color:#1a5f6e;letter-spacing:10px;text-align:center;margin:28px 0;font-family:monospace;">{{ .Token }}</p>
              <p style="font-size:14px;color:#6b7280;margin:16px 0 0;">If you didn't request this code, you can safely ignore this email.</p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f7f4ef;border:1px solid #e8e3db;border-top:none;border-radius:0 0 10px 10px;padding:20px 32px;text-align:center;">
              <p style="margin:0 0 4px;font-size:13px;color:#6b7280;">
                <a href="https://futuretogether.community" style="color:#1a5f6e;text-decoration:none;font-weight:600;">Future Together</a>
                &nbsp;&middot;&nbsp;
                <a href="https://futuretogether.community" style="color:#6b7280;text-decoration:none;">futuretogether.community</a>
              </p>
              <p style="margin:8px 0 0;font-size:12px;color:#9ca3af;"><em>The future is arriving. Let's face it together.</em></p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
